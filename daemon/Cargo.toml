[package]
name = "llmd"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokenizers = "0.21"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
llama-cpp-2 = { version = "0.1.157", features = ["metal"] }
anyhow = "1.0"
encoding_rs = "0.8"
