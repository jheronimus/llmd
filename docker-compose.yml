services:
  llmd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmd
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /data/models/llmd:/root/.cache/llmd/models
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 2048M
