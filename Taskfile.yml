version: '3'

tasks:
  default:
    desc: Run tests and linters
    cmds:
      - task: lint
      - task: test

  build:daemon:
    desc: Build llmd daemon release binary
    dir: daemon
    cmds:
      - cargo build --release

  test:
    desc: Run unit tests
    cmds:
      - CGO_ENABLED=0 go test -v -short ./...

  test:live:
    desc: Run live end-to-end model inference tests
    cmds:
      - CGO_ENABLED=0 go test -v -run TestLiveEndToEnd .

  lint:
    desc: Run golangci-lint
    cmds:
      - mise exec -- golangci-lint run

  fmt:
    desc: Format Go source code
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go.mod dependencies
    cmds:
      - go mod tidy
