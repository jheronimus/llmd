version: '3'

env:
  CGO_LDFLAGS: '-L{{.ROOT_DIR}}/.lib'

tasks:
  default:
    desc: Run tests and linters
    cmds:
      - task: lint
      - task: test

  deps:tokenizers:
    desc: Ensure native libtokenizers.a is present in .lib
    status:
      - test -f {{.ROOT_DIR}}/.lib/libtokenizers.a
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.lib
      - |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac
        echo "Downloading libtokenizers for $OS-$ARCH..."
        curl -sL "https://github.com/daulet/tokenizers/releases/latest/download/libtokenizers.${OS}-${ARCH}.tar.gz" | tar -xz -C {{.ROOT_DIR}}/.lib

  test:
    desc: Run unit tests
    deps: [deps:tokenizers]
    cmds:
      - go test -v -short -race ./...

  test:live:
    desc: Run live end-to-end model inference tests
    deps: [deps:tokenizers]
    cmds:
      - go test -v -run TestLiveEndToEnd .

  lint:
    desc: Run golangci-lint
    cmds:
      - mise exec -- golangci-lint run

  fmt:
    desc: Format Go source code
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go.mod dependencies
    cmds:
      - go mod tidy
